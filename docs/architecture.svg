<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"
     role="img" aria-labelledby="title description">
  <title id="title">Darkfactory architecture</title>
  <desc id="description">The verified VS-1 path runs from Vercel Board through a deterministic controller, a single BB worker and immutable verification on one Git SHA. The worker receives rework through the controller. A final seal checks the working tree, policy and live lease before Board completion. Dashed components show the VS-2 operating model, isolated VS-2 additions and the planned release and observation paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 12" refX="10" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 6 L0 12 Z" fill="#39708d"/>
    </marker>
    <marker id="return" viewBox="0 0 10 12" refX="10" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 6 L0 12 Z" fill="#a45534"/>
    </marker>
    <marker id="future" viewBox="0 0 10 12" refX="10" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 6 L0 12 Z" fill="#7561a7"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18273b; }
    .wordmark { font-size: 48px; font-weight: 740; letter-spacing: -1.6px; }
    .subtitle { font-size: 20px; fill: #41536a; }
    .section { font-size: 16px; font-weight: 730; letter-spacing: 1.65px; fill: #405570; }
    .label { font-size: 20px; font-weight: 720; letter-spacing: -.2px; }
    .feature { font-size: 23px; font-weight: 720; letter-spacing: -.3px; }
    .body { font-size: 17px; fill: #31455d; }
    .strong { font-weight: 680; }
    .small { font-size: 15.5px; fill: #3d5068; }
    .code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 15.5px; }
    .tinycode { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .muted { fill: #4b5f77; }
    .accent { fill: #245773; }
    .purple { fill: #54447e; }
    .rust { fill: #923d20; }
    .chiptext { font-size: 13px; font-weight: 735; letter-spacing: .55px; }
    .card { fill: #fff; stroke: #8299b3; stroke-width: 1.4; }
    .planned { fill: #fbf9ff; stroke: #8875ac; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #39708d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { fill: none; stroke: #a45534; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#return); }
    .future { fill: none; stroke: #7561a7; stroke-width: 1.8; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#future); }
  </style>
  <rect x="1" y="1" width="1598" height="1198" rx="21" fill="#f1f5fa" stroke="#a7b7cc" stroke-width="2"/>
  <path d="M44 120 H1556 M44 1170 H1556" stroke="#c2cedd"/>

  <text x="44" y="67" class="wordmark">Darkfactory architecture</text>
  <text x="46" y="99" class="subtitle">Vercel Board + BB  /  SHA-bound software delivery</text>
  <rect x="972" y="32" width="584" height="77" rx="12" fill="#ffffff" stroke="#c2cedd"/>
  <rect class="card" x="991" y="50" width="29" height="15" rx="3"/>
  <text x="1032" y="63" class="small strong">Built &amp; verified · VS-1 / P0</text>
  <rect class="planned" x="991" y="77" width="29" height="15" rx="3"/>
  <text x="1032" y="90" class="small strong">VS-2 / P1–P2 / VS-4 · isolated additions and planned work</text>
  <text x="44" y="148" class="section">GOVERNANCE &amp; PLANNING</text>
  <rect id="badge-313-130" x="313" y="130" width="217" height="24" rx="6" fill="#eee7fa"/>
  <text x="421.5" y="147" class="chiptext purple" text-anchor="middle" data-panel="badge-313-130">TARGET OPERATING MODEL</text>
  <rect id="owner" class="planned" x="44" y="163" width="300" height="74" rx="11"/>
  <rect id="lead" class="planned" x="385" y="163" width="307" height="74" rx="11"/>
  <rect id="intake" class="planned" x="733" y="163" width="823" height="74" rx="11"/>
  <text x="62" y="191" class="label" data-panel="owner">Portfolio Owner &amp; CTO</text>
  <text x="62" y="215" class="body" data-panel="owner">Gemini 4 Neon · CTO agent</text>
  <text x="403" y="191" class="label" data-panel="lead">Domain Leads</text>
  <text x="403" y="215" class="body" data-panel="lead">Pi/Sol xhigh + logika</text>
  <text x="751" y="191" class="label" data-panel="intake">Matt-skills intake</text>
  <text x="751" y="215" class="code" data-panel="intake">grill → to-spec → to-tickets  /  Board cards carry native needs</text>
  <path class="future" d="M344 200 H380"/>
  <path class="future" d="M692 200 H728"/>
  <path class="future" d="M1120 237 V253"/>
  <rect id="board" class="card" x="44" y="258" width="1512" height="102" rx="11"/>
  <rect x="45" y="259" width="1510" height="100" rx="10" fill="#e9f2f8"/>
  <path d="M445 275 V343 M1110 275 V343" stroke="#bdcfdc"/>
  <text x="63" y="291" class="feature" data-panel="board">Vercel Board</text>
  <text x="63" y="319" class="body strong" data-panel="board">QueuePort · authoritative task queue</text>
  <text x="465" y="287" class="section" data-panel="board">NATIVE TASK STATES</text>
  <rect id="badge-465-302" x="465" y="302" width="96" height="27" rx="6" fill="#e1edf6"/>
  <text x="513.0" y="321" class="chiptext accent" text-anchor="middle" data-panel="badge-465-302">ready</text>
  <rect id="badge-570-302" x="570" y="302" width="111" height="27" rx="6" fill="#e1edf6"/>
  <text x="625.5" y="321" class="chiptext accent" text-anchor="middle" data-panel="badge-570-302">waiting</text>
  <rect id="badge-690-302" x="690" y="302" width="114" height="27" rx="6" fill="#e1edf6"/>
  <text x="747.0" y="321" class="chiptext accent" text-anchor="middle" data-panel="badge-690-302">claimed</text>
  <rect id="badge-813-302" x="813" y="302" width="116" height="27" rx="6" fill="#e1edf6"/>
  <text x="871.0" y="321" class="chiptext accent" text-anchor="middle" data-panel="badge-813-302">blocked</text>
  <rect id="badge-938-302" x="938" y="302" width="140" height="27" rx="6" fill="#e1edf6"/>
  <text x="1008.0" y="321" class="chiptext accent" text-anchor="middle" data-panel="badge-938-302">completed</text>
  <text x="1131" y="287" class="small strong" data-panel="board">needs DAG · server-side epoch and lease until</text>
  <text x="1131" y="310" class="body" data-panel="board">Visible task state and terminal evidence</text>
  <text x="1131" y="333" class="small" data-panel="board">Compact Board receipts ≤ 1,000 characters</text>
  <text x="44" y="405" class="section">DETERMINISTIC CONTROL &amp; ISOLATED EXECUTION</text>
  <rect id="badge-572-386" x="572" y="386" width="337" height="24" rx="6" fill="#dcefec"/>
  <text x="740.5" y="403" class="chiptext accent" text-anchor="middle" data-panel="badge-572-386">0 LLM CALLS IN IDLE OR ORCHESTRATION</text>
  <path class="line" d="M44 326 H33 V457 H41"/>
  <path class="line" d="M1556 774 H1578 V310 H1560"/>
  <path class="return" d="M44 903 H22 V524 H41"/>
  <rect id="controller" class="card" x="44" y="426" width="334" height="188" rx="11"/>
  <rect id="worker" class="card" x="397" y="426" width="355" height="188" rx="11"/>
  <rect id="subject" class="card" x="771" y="426" width="371" height="188" rx="11"/>
  <rect id="model" class="card" x="1161" y="426" width="395" height="188" rx="11"/>
  <path class="line" d="M378 501 H393"/>
  <path class="line" d="M752 501 H767"/>
  <text x="63" y="456" class="label" data-panel="controller">Controller &amp; slot lock</text>
  <text x="63" y="479" class="tinycode" data-panel="controller">controller.mjs · slot.mjs · flock</text>
  <text x="63" y="502" class="body" data-panel="controller">Claim, renew, reconcile on restart.</text>
  <text x="63" y="525" class="tinycode" data-panel="controller">Quarantine on uncertain / lease_lost</text>
  <path d="M63 541 H359" stroke="#dee6ef"/>
  <text x="63" y="565" class="small strong" data-panel="controller">Private WAL · 0700 dir / 0600 files</text>
  <text x="63" y="588" class="code" data-panel="controller">Atomic intent → receipt / unknown</text>
  <text x="416" y="456" class="label" data-panel="worker">BB worker</text>
  <text x="416" y="478" class="small strong" data-panel="worker">WorkerPort · one writer per worktree</text>
  <text x="416" y="500" class="code" data-panel="worker">acp-devin / swe-2-high</text>
  <text x="416" y="522" class="body" data-panel="worker">Fallback: ZCode / GLM-5.3 Flash</text>
  <text x="416" y="544" class="body" data-panel="worker">Typed handoff file outside the repo.</text>
  <text x="416" y="566" class="body" data-panel="worker">No Board token, completion grant,</text>
  <text x="416" y="588" class="body" data-panel="worker">or deployment permission.</text>
  <text x="790" y="456" class="label" data-panel="subject">CandidateSubject</text>
  <text x="790" y="480" class="code" data-panel="subject">Canonical SHA-256 → subject_digest</text>
  <text x="790" y="504" class="code" data-panel="subject">base_sha · candidate_sha · tree_sha</text>
  <text x="790" y="528" class="tinycode" data-panel="subject">artifacts · spec_digest · policy_digest</text>
  <text x="790" y="552" class="tinycode" data-panel="subject">fixtures_digest · release_target.finish</text>
  <text x="790" y="576" class="body" data-panel="subject">Pinned to the candidate and its contract.</text>
  <text x="1180" y="456" class="label" data-panel="model">TLA+ / TLC formal model</text>
  <rect id="badge-1451-435" x="1451" y="435" width="86" height="27" rx="6" fill="#dcefec"/>
  <text x="1494.0" y="454" class="chiptext accent" text-anchor="middle" data-panel="badge-1451-435">6 / 6</text>
  <text x="1180" y="483" class="small strong" data-panel="model">Base model + five invariant mutations</text>
  <text x="1180" y="506" class="code" data-panel="model">SingleLiveWriter</text>
  <text x="1180" y="527" class="code" data-panel="model">NoDuplicateSpawn</text>
  <text x="1180" y="548" class="code" data-panel="model">NoStaleCommit</text>
  <text x="1180" y="569" class="code" data-panel="model">NoWatermarkRegression</text>
  <text x="1180" y="590" class="code" data-panel="model">NoBlindRoundClose</text>
  <path class="line" d="M947 614 V642"/>
  <rect id="snapshot" x="44" y="646" width="1512" height="51" rx="9" fill="#e3eef7" stroke="#97aec6"/>
  <text x="64" y="677" class="section" data-panel="snapshot">IMMUTABLE VERIFICATION</text>
  <text x="438" y="678" class="code strong" data-panel="snapshot">unpackExact(candidate_sha) → /candidate:ro</text>
  <text x="1113" y="678" class="small strong" data-panel="snapshot">One Git snapshot across L1, L3 and L2</text>
  <path class="line" d="M211 697 V719"/>
  <rect id="local" class="card" x="44" y="723" width="334" height="222" rx="11"/>
  <rect id="visual" class="card" x="397" y="723" width="355" height="222" rx="11"/>
  <rect id="review" class="card" x="771" y="723" width="426" height="222" rx="11"/>
  <rect id="seal" class="card" x="1216" y="723" width="340" height="222" rx="11"/>
  <path class="line" d="M378 774 H393"/>
  <path class="line" d="M752 774 H767"/>
  <path class="line" d="M1197 774 H1212"/>
  <text x="63" y="753" class="label" data-panel="local">L1 · Deterministic checks</text>
  <text x="63" y="775" class="body strong" data-panel="local">Offline rootless Docker</text>
  <text x="63" y="797" class="code" data-panel="local">--network=none --read-only</text>
  <text x="63" y="819" class="code" data-panel="local">--cap-drop=ALL</text>
  <text x="63" y="841" class="body" data-panel="local">Tamper gate blocks test deletion,</text>
  <text x="63" y="863" class="body" data-panel="local">test skips and matched secret leaks.</text>
  <rect id="red" x="63" y="881" width="296" height="46" rx="7" fill="#faece5"/>
  <text x="75" y="900" class="small strong rust" data-panel="red">Red L1 → zero L2 calls</text>
  <text x="75" y="920" class="small rust" data-panel="red">Evidence goes to the same BB worker.</text>
  <text x="416" y="753" class="label" data-panel="visual">L3 · Visual UI gate</text>
  <text x="416" y="778" class="code" data-panel="visual">Required when has_ui: true</text>
  <text x="416" y="803" class="body" data-panel="visual">Runs the trusted render profile.</text>
  <text x="416" y="828" class="body strong" data-panel="visual">VisualReceipt carries SHA-256</text>
  <text x="416" y="853" class="body" data-panel="visual">hashes of render artifacts.</text>
  <text x="416" y="878" class="body" data-panel="visual">Failure returns to the same worker.</text>
  <text x="790" y="753" class="label" data-panel="review">L2 · Independent review</text>
  <text x="790" y="775" class="small strong" data-panel="review">ReviewPort · read-only Pi/Sol 6.2 (medium)</text>
  <text x="790" y="797" class="code" data-panel="review">family(critic) !== family(executor)</text>
  <rect id="neon" class="planned" x="787" y="813" width="394" height="121" rx="8"/>
  <rect id="badge-799-822" x="799" y="822" width="232" height="24" rx="6" fill="#eee7fa"/>
  <text x="915.0" y="839" class="chiptext purple" text-anchor="middle" data-panel="badge-799-822">VS-2 T1 · ISOLATED ADAPTER</text>
  <text x="799" y="862" class="small" data-panel="neon">Gemini 4 Neon (medium) · logika / humanizer</text>
  <text x="799" y="882" class="small" data-panel="neon">Pi/Sol 6.2 escalation · third-family arbiter</text>
  <text x="799" y="902" class="small" data-panel="neon">Host proxy bridge in progress · model-only</text>
  <text x="799" y="922" class="small" data-panel="neon">Board and loopback destinations denied</text>
  <text x="1235" y="753" class="label" data-panel="seal">Seal · Final acceptance</text>
  <text x="1235" y="777" class="body" data-panel="seal">Re-check clean worktree and</text>
  <text x="1235" y="801" class="code" data-panel="seal">HEAD == candidate_sha</text>
  <text x="1235" y="825" class="body" data-panel="seal">Re-read the pinned policy_digest</text>
  <text x="1235" y="849" class="body" data-panel="seal">and verify the live lease epoch.</text>
  <text x="1235" y="873" class="tinycode strong accent" data-panel="seal">finish=verified → Board.complete</text>
  <text x="1235" y="897" class="tinycode strong purple" data-panel="seal">finish=deployed → release path</text>
  <text x="1235" y="921" class="small" data-panel="seal">Guards against TOCTOU drift.</text>
  <text x="44" y="984" class="section">VS-2 / P1–P2 / VS-4 ROADMAP</text>
  <path class="future" d="M1386 945 V965 H591 V999"/>
