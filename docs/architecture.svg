  <rect id="release" class="planned" x="397" y="1003" width="389" height="150" rx="11"/>
  <rect id="rollout" class="planned" x="805" y="1003" width="351" height="150" rx="11"/>
  <rect id="observer" class="planned" x="1175" y="1003" width="381" height="150" rx="11"/>
  <rect id="badge-62-1015" x="62" y="1015" width="284" height="24" rx="6" fill="#eee7fa"/>
  <text x="204.0" y="1032" class="chiptext purple" text-anchor="middle" data-panel="badge-62-1015">P1.1 / VS-2 T2 · BUILT IN ISOLATION</text>
  <rect id="badge-415-1015" x="415" y="1015" width="169" height="24" rx="6" fill="#eee7fa"/>
  <text x="499.5" y="1032" class="chiptext purple" text-anchor="middle" data-panel="badge-415-1015">P1.2–P1.3 · PLANNED</text>
  <rect id="badge-823-1015" x="823" y="1015" width="213" height="24" rx="6" fill="#eee7fa"/>
  <text x="929.5" y="1032" class="chiptext purple" text-anchor="middle" data-panel="badge-823-1015">P2.1 / VS-2 T3 · PLANNED</text>
  <rect id="badge-1193-1015" x="1193" y="1015" width="233" height="24" rx="6" fill="#eee7fa"/>
  <text x="1309.5" y="1032" class="chiptext purple" text-anchor="middle" data-panel="badge-1193-1015">P2.2 / VS-4 · PLANNED</text>
  <text x="62" y="1065" class="label" data-panel="question">Owner decision &amp; resume</text>
  <text x="62" y="1088" class="body" data-panel="question">One question → signed owner answer</text>
  <text x="62" y="1111" class="body" data-panel="question">Idempotent resume · new epoch</text>
  <text x="62" y="1134" class="body" data-panel="question">Same worker for product decisions</text>
  <text x="415" y="1065" class="label" data-panel="release">Authorized release</text>
  <text x="415" y="1088" class="small strong" data-panel="release">ApprovalReceipt · owner gate for harm=10</text>
  <text x="415" y="1111" class="code" data-panel="release">ReleasePort → live version + smoke</text>
  <text x="415" y="1134" class="body" data-panel="release">Failed smoke → authorized rollback</text>
  <text x="823" y="1065" class="label" data-panel="rollout">Live Board rollout</text>
  <text x="823" y="1088" class="body" data-panel="rollout">Allowlist + kill switch</text>
  <text x="823" y="1111" class="body" data-panel="rollout">Channel, owner, repo, profile and finish</text>
  <text x="823" y="1134" class="body" data-panel="rollout">Phase updates on the Board card</text>
  <text x="1193" y="1065" class="label" data-panel="observer">Observer &amp; factory memory</text>
  <text x="1193" y="1088" class="body" data-panel="observer">Read-only observation</text>
  <text x="1193" y="1111" class="body" data-panel="observer">Incidents deduplicated by fingerprint</text>
  <text x="1193" y="1134" class="body" data-panel="observer">Evidence feeds the learning loop</text>
  <text x="44" y="1190" class="small muted">Deployment uses a separate authorization path. VS-1 verification and VS-2 additions are scoped to isolated Board environments.</text>
</svg>
