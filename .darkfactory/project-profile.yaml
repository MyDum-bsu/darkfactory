taste:
  - Keep changes minimal and strictly within the Scope Fence. Avoid dead code and unnecessary abstractions.
  - Require deterministic checks, explicit receipts, and accurate status reports.
  - "Fail closed at trust boundaries: never silently enable secret access, writes, network access, or execution."
  - "Keep the UI readable under load: use safe DOM operations, clear states, and no visual clutter."
